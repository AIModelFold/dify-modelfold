# Workflow that picks a ModelFold model from the OpenAI-API-compatible provider.
# Install that plugin and add a model named gpt-6-luna (see the README) before
# you run this app. If the node says the model is missing, re-select it.
# This file contains no API key.
app:
  description: One LLM node that calls the ModelFold model gpt-6-luna.
  icon: 💬
  icon_background: '#E4F2FF'
  mode: workflow
  name: ModelFold LLM
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-to-llm
      source: start_node
      sourceHandle: source
      target: llm_node
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: llm-to-end
      source: llm_node
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: question
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: question
      height: 90
      id: start_node
      position:
        x: 80
        y: 220
      positionAbsolute:
        x: 80
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Text only. Leave vision and tools off.
        model:
          completion_params:
            temperature: 0.7
            max_tokens: 512
          mode: chat
          name: gpt-6-luna
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - edition_type: basic
          id: user-prompt
          role: user
          text: '{{#start_node.question#}}'
        selected: false
        title: ModelFold
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: llm_node
      position:
        x: 400
        y: 220
      positionAbsolute:
        x: 400
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - llm_node
          - text
          value_type: string
          variable: answer
        selected: false
        title: End
        type: end
      height: 90
      id: end_node
      position:
        x: 720
        y: 220
      positionAbsolute:
        x: 720
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
